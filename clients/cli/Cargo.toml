[package]
name = "token-acl-cli"
version = { workspace = true }
description = "A CLI app to interact with the Token ACL smart contract on solana!"
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
clap = { version = "3", default-features = false, features = ["std", "cargo", "suggestions"] }
solana-clap-v3-utils = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-cli-config = "4.3.2"
solana-client = { workspace = true }
solana-logger = "3.0.0"
solana-remote-wallet = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-sdk = { workspace = true }
tokio = { version = "1", features = ["full"] }
token-acl-client = { workspace = true, features = ["fetch"] }
spl-associated-token-account-interface  = { workspace = true }
spl-token-metadata-interface = { workspace = true }
solana-system-interface = { workspace = true }
solana-commitment-config = "3.1.0"
spl-token-2022-interface = { workspace = true }

[[bin]]
name = "token-acl-cli"
path = "src/main.rs"

[lints]
workspace = true